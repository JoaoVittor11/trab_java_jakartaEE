<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<ui:composition template="../template.xhtml">
    <ui:define name="title">Cadastro de Livros - Admin</ui:define>
    
    <ui:define name="content">
        <h2>➕ Cadastro de Novo Livro</h2>
        
        <h:form style="max-width: 500px;">
            <div class="form-group">
                <label>Título:</label>
                <h:inputText value="#{livroBean.livro.titulo}" 
                           required="true"
                           requiredMessage="Título é obrigatório"
                           styleClass="form-control"/>
            </div>

            <div class="form-group">
                <label>ISBN:</label>
                <h:inputText value="#{livroBean.livro.isbn}" 
                           required="true"
                           requiredMessage="ISBN é obrigatório"
                           styleClass="form-control"/>
            </div>

            <div class="form-group">
                <label>Autor:</label>
                <h:selectOneMenu value="#{livroBean.livro.autor}" 
                              required="true"
                              requiredMessage="Selecione um autor"
                              styleClass="form-control">
                    <f:selectItem itemLabel="-- Selecione --" noSelectionOption="true"/>
                    <f:selectItems value="#{livroBean.autores}" 
                                 var="autor"
                                 itemValue="#{autor}"
                                 itemLabel="#{autor.nome}"/>
                </h:selectOneMenu>
            </div>

            <div style="margin-top: 20px;">
                <h:commandButton value="Salvar" 
                              action="#{livroBean.salvarLivro()}"
                              styleClass="btn btn-primary"
                              style="background-color: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;"/>
                <h:commandButton value="Cancelar" 
                              action="redirect:/livros.xhtml"
                              immediate="true"
                              styleClass="btn btn-secondary"
                              style="background-color: #999; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;"/>
            </div>

            <h:messages globalOnly="true" 
                     styleClass="alert alert-danger"
                     style="color: red; margin-top: 20px; padding: 10px; background-color: #ffebee; border-radius: 5px;"/>
        </h:form>

        <style>
            h2 { color: #667eea; margin-bottom: 30px; }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #333;
            }
            
            .form-control {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 5px;
                font-size: 14px;
                font-family: inherit;
            }
            
            .form-control:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
            }
        </style>
    </ui:define>
</ui:composition>
